name: Linux package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fxsound-linux
    paths:
      - 'linux/**'
      - 'dsp/**'
      - 'audiopassthru/**'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/linux-package.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git \
            libpipewire-0.3-dev libspa-0.2-dev \
            libgtk-3-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev \
            libfreetype6-dev libfontconfig1-dev libasound2-dev

      - name: Fetch JUCE 6.1.6
        run: git clone --depth 1 --branch 6.1.6 https://github.com/juce-framework/JUCE.git linux/.deps/JUCE

      - name: Configure
        run: |
          cmake -S linux -B linux/build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFXSOUND_BUILD_PIPEWIRE=ON \
            -DFXSOUND_JUCE_DIR="$GITHUB_WORKSPACE/linux/.deps/JUCE"

      - name: Build
        run: cmake --build linux/build-release

      - name: Test DSP
        run: |
          linux/build-release/dsp_smoke
          linux/build-release/preset_audio_test linux/factory-presets/1.fac

      - name: Stage portable build
        run: |
          mkdir -p dist/fxsound-linux
          cp linux/build-release/fxsound_pipewire dist/fxsound-linux/fxsoundd
          cp "linux/build-release/fxsound_linux_ui_artefacts/Release/FxSound Linux" dist/fxsound-linux/fxsound-ui
          cp linux/fxsound-rt-priority.sh dist/fxsound-linux/
          cp -r linux/factory-presets dist/fxsound-linux/
          cp LICENSE README.md dist/fxsound-linux/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxsound-linux-x86_64
          path: dist/fxsound-linux
